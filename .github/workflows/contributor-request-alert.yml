name: Contributor Request Alert

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  notify-owner:
    if: contains(github.event.issue.labels.*.name, 'contributor-request')
    runs-on: ubuntu-latest
    steps:
      - name: Notify repository owner
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          curl --fail-with-body --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/issues/$ISSUE_NUMBER/assignees" \
            --data "{\"assignees\":[\"$OWNER\"]}"
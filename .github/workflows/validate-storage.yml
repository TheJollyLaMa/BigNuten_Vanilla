name: Validate Snapshot Storage

on:
  push:
    branches: [main]
    paths:
      - js/dataControl.js
      - js/ipfsHostAdapter.js
      - js/fitnessData.js
      - js/timezone.js
      - js/storageProvider.js
      - js/snapshotLifecycle.js
      - js/pinataStorage.js
      - js/ipfsStorage.js
      - js/providers/pinataProvider.js
      - test/snapshotTransport.test.js
      - test/dataControlStorage.test.js
      - test/ipfsHostAdapter.test.js
      - .github/workflows/validate-storage.yml
  pull_request:
    branches: [main]
    paths:
      - js/dataControl.js
      - js/ipfsHostAdapter.js
      - js/fitnessData.js
      - js/timezone.js
      - js/storageProvider.js
      - js/snapshotLifecycle.js
      - js/pinataStorage.js
      - js/ipfsStorage.js
      - js/providers/pinataProvider.js
      - test/snapshotTransport.test.js
      - test/dataControlStorage.test.js
      - test/ipfsHostAdapter.test.js
      - .github/workflows/validate-storage.yml

permissions:
  contents: read

jobs:
  storage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test synthetic snapshot storage and error visibility
        run: node --test test/snapshotTransport.test.js test/dataControlStorage.test.js test/ipfsHostAdapter.test.js

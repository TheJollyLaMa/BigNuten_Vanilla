name: Dashboard browser smoke
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check dashboard surfaces and no-real-funds local-fork StreakBet rehearsal
        run: npm run test:smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-smoke-screenshots
          path: |
            test-results/smoke
            test-results/rehearsal
          if-no-files-found: warn

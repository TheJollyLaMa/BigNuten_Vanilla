name: Contributor Request
description: Request to help build or test BigNuten
title: "Contributor request: "
labels: ["contributor-request"]
body:
  - type: input
    id: github
    attributes:
      label: GitHub username
      description: Your GitHub handle
      placeholder: yourname
    validations:
      required: true
  - type: input
    id: wallet
    attributes:
      label: Wallet address
      description: Ethereum wallet address for ART or BNUT payouts
      placeholder: 0x...
    validations:
      required: true
  - type: textarea
    id: technical-help
    attributes:
      label: What technical work do you want to help with?
      placeholder: Frontend, contracts, tooling, testing, research, or a specific issue
    validations:
      required: true
  - type: textarea
    id: links
    attributes:
      label: Relevant links
      description: Repositories, shipped work, or other useful technical links
    validations:
      required: false